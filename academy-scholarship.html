<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ABBA Academy · Solicitud de beca</title><link rel="icon" href="/favicon-gold.png"><style>*{box-sizing:border-box}body{margin:0;background:#fff9f5;color:#49172e;font:16px system-ui,-apple-system,sans-serif}header{background:#650820;color:#f1cf90;padding:20px;display:flex;justify-content:space-between;gap:12px}a{color:#9e6528}header a{color:#f1cf90}main{max-width:690px;margin:30px auto;padding:0 16px}section{background:#fff;border:1px solid #e7d5c8;border-radius:18px;padding:26px;margin-bottom:18px}h1{font-family:Georgia,serif;font-size:32px}p{line-height:1.6}label{display:block;font-weight:700;margin-top:17px}input,select,textarea{display:block;width:100%;border:1px solid #c3aeb4;border-radius:9px;padding:13px;margin-top:7px;font:inherit;min-height:46px}textarea{min-height:130px}button{display:block;background:#650820;color:white;border:0;border-radius:10px;padding:15px 20px;margin-top:20px;font-weight:750;font-size:16px;cursor:pointer}button:disabled{opacity:.5}.small{font-size:13px;color:#755862}.hidden{display:none}#status,#signinStatus{margin:12px 0;font-weight:650;overflow-wrap:anywhere}</style></head><body><header><strong>ABBA Academy · Becas</strong><a href="/academy.html">Academy</a></header><main><h1 id="title">Solicitud de beca</h1><p id="intro">Para solicitar una beca, inicia sesión con la cuenta que ya registraste y verificaste. Una solicitud no garantiza su aprobación ni acceso a las clases.</p><section id="login"><h2 id="loginTitle">Iniciar sesión</h2><form id="loginForm"><label id="emailLabel">Correo electrónico<input id="email" type="email" autocomplete="username" required></label><label id="passwordLabel">Contraseña<input id="password" type="password" autocomplete="current-password" required></label><button id="signInButton">Entrar</button></form><p id="signinStatus" role="status"></p></section><section id="request" class="hidden"><button id="signOut" type="button" style="background:#eee;color:#49172e;margin:0 0 12px">Cerrar sesión</button><h2 id="formTitle">Solicitar apoyo económico</h2><form id="scholarshipForm"><label id="nameLabel">Nombre completo<input id="name" maxlength="120" required></label><label id="countryLabel">País<input id="country" maxlength="100" required></label><label id="percentLabel">Porcentaje de beca solicitado<select id="percent"><option value="50">50 %</option><option value="80">80 %</option><option value="100">100 %</option></select></label><label id="reasonLabel">¿Por qué necesitas la beca? (mínimo 30 caracteres)<textarea id="reason" minlength="30" maxlength="3000" required></textarea></label><button id="submitButton" type="submit">Enviar solicitud</button></form><p id="status" role="status" aria-live="polite"></p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(()=>{'use strict';const db=supabase.createClient('https://yecywtxbuhfukergbwfc.supabase.co','sb_publishable_jFIuvZYIs1b-6IjqCnDPDw_BDivhFKs');const $=id=>document.getElementById(id);const lang=(()=>{try{return ['en','es','pt'].includes(localStorage.getItem('pf_lang'))?localStorage.getItem('pf_lang'):'en'}catch{return'en'}})();const words={en:['Scholarship application','Sign in with your registered and verified account. A request does not guarantee approval or course access.','Sign in','Email address','Password','Sign in','Apply for financial assistance','Full name','Country','Scholarship requested','Why do you need assistance? (at least 30 characters)','Submit application','Sign out','Application submitted. The Academy administration will review your request. Classes are not yet open.','You already have a scholarship application. Status: ','Please verify your email before applying.'],es:['Solicitud de beca','Entra con tu cuenta registrada y verificada. Solicitar una beca no garantiza su aprobación ni acceso a las clases.','Iniciar sesión','Correo electrónico','Contraseña','Entrar','Solicitar apoyo económico','Nombre completo','País','Beca solicitada','¿Por qué necesitas una beca? (mínimo 30 caracteres)','Enviar solicitud','Cerrar sesión','Solicitud enviada. La administración revisará tu petición. Las clases todavía están cerradas.','Ya tienes una solicitud. Estado: ','Confirma tu correo electrónico antes de solicitar la beca.'],pt:['Pedido de bolsa de estudos','Entre com sua conta cadastrada e verificada. O pedido não garante aprovação nem acesso às aulas.','Entrar','E-mail','Senha','Entrar','Solicitar apoio financeiro','Nome completo','País','Bolsa solicitada','Por que precisa da bolsa? (mínimo de 30 caracteres)','Enviar pedido','Sair','Pedido enviado. A direção analisará sua solicitação. As aulas ainda estão fechadas.','Você já enviou um pedido. Estado: ','Confirme seu e-mail antes de solicitar uma bolsa.']};const t=words[lang];document.documentElement.lang=lang;['title','intro','loginTitle','emailLabel','passwordLabel','signInButton','formTitle','nameLabel','countryLabel','percentLabel','reasonLabel','submitButton','signOut'].forEach((id,i)=>{const node=$(id);if(node.tagName==='LABEL')node.firstChild.textContent=t[i];else node.textContent=t[i]});let active=null;
async function refresh(){const {data:{user}}=await db.auth.getUser();active=user;$('login').classList.toggle('hidden',!!user);$('request').classList.toggle('hidden',!user);if(!user)return;if(!user.email_confirmed_at){$('status').textContent=t[15];$('scholarshipForm').classList.add('hidden');return}const meta=user.user_metadata||{};$('name').value=meta.full_name||'';$('country').value=meta.country||'';const{data,error}=await db.from('abba_scholarship_applications').select('status,requested_percent,approved_percent').eq('user_id',user.id).maybeSingle();if(error){$('status').textContent=error.message;return}if(data){$('scholarshipForm').classList.add('hidden');$('status').textContent=t[14]+data.status+(data.approved_percent!==null?' · '+data.approved_percent+' %':'')}else{$('scholarshipForm').classList.remove('hidden');$('status').textContent=''}}
$('loginForm').onsubmit=async e=>{e.preventDefault();$('signinStatus').textContent='…';const{error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){$('signinStatus').textContent=error.message;return}$('signinStatus').textContent='';await refresh()};$('scholarshipForm').onsubmit=async e=>{e.preventDefault();if(!active)return;const btn=$('submitButton');btn.disabled=true;$('status').textContent='…';try{const{error}=await db.from('abba_scholarship_applications').insert({user_id:active.id,full_name:$('name').value.trim(),country:$('country').value.trim(),requested_percent:Number($('percent').value),reason:$('reason').value.trim(),status:'pending'});if(error)throw error;$('status').textContent=t[13];await refresh()}catch(err){$('status').textContent=err.message}finally{btn.disabled=false}};$('signOut').onclick=async()=>{await db.auth.signOut();location.reload()};refresh()})();
</script></body></html>
