name: Fix gallery separation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-gallery-separation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-gallery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Separate photos and videos
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          s = path.read_text(encoding='utf-8')
          original = s

          # Public Gallery: remove the mixed "All" view and make Photos the default.
          s, n = re.subn(
              r'\s*<button\s+class="galleryFilter active"\s+type="button"\s+data-gallery-filter="all"\s*>\s*All\s*</button>\s*',
              '\n',
              s,
              count=1,
          )
          if n != 1:
              raise SystemExit('Could not find the public All gallery filter')

          s, n = re.subn(
              r'<button\s+class="galleryFilter"\s+type="button"\s+data-gallery-filter="photos"\s*>',
              '<button\n          class="galleryFilter active"\n          type="button"\n          data-gallery-filter="photos"\n        >',
              s,
              count=1,
          )
          if n != 1:
              raise SystemExit('Could not make Photos the default filter')

          s = s.replace(
              'let activeGalleryFilter = "all";',
              'let activeGalleryFilter = "photos";',
              1,
          )

          old_items = '''  const items =\n    activeGalleryFilter === "all"\n      ? publicGalleryItems\n      : publicGalleryItems.filter(\n          item =>\n            galleryMediaType(item) ===\n            activeGalleryFilter\n        );'''
          new_items = '''  const items =\n    publicGalleryItems.filter(\n      item =>\n        galleryMediaType(item) ===\n        activeGalleryFilter\n    );'''
          if old_items not in s:
              raise SystemExit('Could not find mixed gallery rendering logic')
          s = s.replace(old_items, new_items, 1)

          s = s.replace(
              'button.dataset.galleryFilter ||\n            "all";',
              'button.dataset.galleryFilter ||\n            "photos";',
              1,
          )

          # Persist an explicit media_type for every newly uploaded or edited item.
          payload_marker = '''    const payload = {\n\n      title:\n        galleryTitle.value.trim(),'''
          payload_replacement = '''    const detectedMediaType =\n      file?.type?.startsWith("video/")\n        ? "video"\n        : file?.type?.startsWith("image/")\n          ? "image"\n          : galleryMediaType({image_url:imageUrl}) === "videos"\n            ? "video"\n            : "image";\n\n\n    const payload = {\n\n      media_type:\n        detectedMediaType,\n\n      title:\n        galleryTitle.value.trim(),'''
          if payload_marker not in s:
              raise SystemExit('Could not find Gallery payload')
          s = s.replace(payload_marker, payload_replacement, 1)

          # Admin list/edit preview must honor media_type, not only the URL extension.
          s = s.replace(
              '/\\.(mp4|webm|mov|m4v)(\\?|#|$)/i.test(photo.image_url || "")',
              '(String(photo.media_type || "").toLowerCase() === "video" || /\\.(mp4|webm|mov|m4v)(\\?|#|$)/i.test(photo.image_url || ""))',
              1,
          )
          s = s.replace(
              'if(/\\.(mp4|webm|mov|m4v)(\\?|#|$)/i.test(data.image_url || "")){',
              'if(String(data.media_type || "").toLowerCase() === "video" || /\\.(mp4|webm|mov|m4v)(\\?|#|$)/i.test(data.image_url || "")){',
              1,
          )

          # Give embedded videos the same responsive media box behavior as photos.
          css_marker = '''.galleryCard:hover img{\n  transform:scale(1.035);\n}'''
          css_replacement = '''.galleryCard:hover img{\n  transform:scale(1.035);\n}\n\n.galleryImage video{\n  width:100%;\n  height:100%;\n  display:block;\n  object-fit:contain;\n  background:#000;\n}'''
          if css_marker in s and '.galleryImage video{' not in s:
              s = s.replace(css_marker, css_replacement, 1)

          if s == original:
              raise SystemExit('No changes were made')

          path.write_text(s, encoding='utf-8')

      - name: Validate gallery changes
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q 'data-gallery-filter="all"' index.html
          grep -q 'data-gallery-filter="photos"' index.html
          grep -q 'data-gallery-filter="videos"' index.html
          grep -q 'let activeGalleryFilter = "photos";' index.html
          grep -q 'media_type:' index.html

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Separate Gallery photos and videos'
          git push origin HEAD:main
