name: Patch subscriber filter

on:
  push:
    paths:
      - '.github/workflows/patch-subscriber-filter.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch filter logic
        shell: python
        run: |
          from pathlib import Path
          path = Path('admin-subscribers.js')
          text = path.read_text(encoding='utf-8')
          start = text.index("    const oldEmpty = list.querySelector('.subscriberListEmpty');")
          end = text.index("    updateStats();", start)
          replacement = ("    const oldEmpty = list.querySelector('.subscriberListEmpty');\n" "    if (rows.length && visible === 0) {\n" "      if (!oldEmpty) {\n" "        const empty = document.createElement('div');\n" "        empty.className = 'subscriberListEmpty';\n" "        empty.textContent = 'No subscribers match this filter.';\n" "        list.appendChild(empty);\n" "      }\n" "    } else if (oldEmpty) {\n" "      oldEmpty.remove();\n" "    }\n")
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-subscribers.js
          git commit -m "Prevent subscriber filter refresh loop"
          git push