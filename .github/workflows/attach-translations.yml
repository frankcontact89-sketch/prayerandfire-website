name: Attach translations

on:
  push:
    paths:
      - '.github/workflows/attach-translations.yml'

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Attach translations script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script defer src="./translations.js"></script>'
          if tag not in s:
              s = s.replace('</body>', f'  {tag}\n</body>')
              p.write_text(s, encoding='utf-8')
          PY
      - name: Remove one-time workflow and publish
        shell: bash
        run: |
          git rm .github/workflows/attach-translations.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Enable full EN ES PT public site translation"
          git push
