name: Fix subscriber workspace

on:
  push:
    paths:
      - '.github/workflows/fix-subscriber-workspace.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prevent empty-filter mutation loop
        shell: python
        run: |
          from pathlib import Path
          path = Path('admin-subscribers.js')
          text = path.read_text(encoding='utf-8')
          old = '''    const oldEmpty = list.querySelector('.subscriberListEmpty');
    if (oldEmpty) oldEmpty.remove();
    if (rows.length && visible === 0) {
      const empty = document.createElement('div');
      empty.className = 'subscriberListEmpty';
      empty.textContent = 'No subscribers match this filter.';
      list.appendChild(empty);
    }
    updateStats();'''
          new = '''    const oldEmpty = list.querySelector('.subscriberListEmpty');
    if (rows.length && visible === 0) {
      if (!oldEmpty) {
        const empty = document.createElement('div');
        empty.className = 'subscriberListEmpty';
        empty.textContent = 'No subscribers match this filter.';
        list.appendChild(empty);
      }
    } else if (oldEmpty) {
      oldEmpty.remove();
    }
    updateStats();'''
          if old not in text:
              raise SystemExit('Expected block not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-subscribers.js
          git commit -m "Stabilize subscriber audience filtering"
          git push