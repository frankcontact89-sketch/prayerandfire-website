name: Attach hero translation fix
on:
  push:
    paths:
      - '.github/workflows/attach-hero-translation-fix.yml'
permissions:
  contents: write
jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Attach hero translation fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script defer src="./translations-hero-fix.js"></script>'
          if tag not in s:
              s=s.replace('</body>', f'  {tag}\n</body>')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Remove workflow and publish
        run: |
          git rm .github/workflows/attach-hero-translation-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Complete translated hero headline"
          git push
