name: Fix language selector

on:
  push:
    paths:
      - '.github/workflows/fix-language-selector.yml'

permissions:
  contents: write

jobs:
  fix-language:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace language preference stub with working translations
