const PF_ATTRIBUTE_TRANSLATIONS = {
  es: {
    "Language":"Idioma",
    "Open live meeting":"Abrir reunión en vivo",
    "Filter gallery media":"Filtrar contenido de la galería",
    "Name":"Nombre",
    "Email":"Correo electrónico",
    "Country":"País",
    "Close image":"Cerrar imagen"
  },
  pt: {
    "Language":"Idioma",
    "Open live meeting":"Abrir reunião ao vivo",
    "Filter gallery media":"Filtrar conteúdo da galeria",
    "Name":"Nome",
    "Email":"E-mail",
    "Country":"País",
    "Close image":"Fechar imagem"
  }
};

function normalizePfText(value){
  return String(value || "").replace(/\s+/g," ").trim();
}

function pfEnglishKey(value){
  const normalized = normalizePfText(value);
  if(!normalized) return "";
  if(PF_TRANSLATIONS.es[normalized] || PF_TRANSLATIONS.pt[normalized]) return normalized;
  for(const lang of ["es","pt"]){
    for(const [english,translated] of Object.entries(PF_TRANSLATIONS[lang])){
      if(normalizePfText(translated) === normalized) return english;
    }
  }
  return normalized;
}

function pfAttributeEnglishKey(value){
  const normalized = normalizePfText(value);
  if(!normalized) return "";
  if(PF_ATTRIBUTE_TRANSLATIONS.es[normalized] || PF_ATTRIBUTE_TRANSLATIONS.pt[normalized]) return normalized;
  for(const lang of ["es","pt"]){
    for(const [english,translated] of Object.entries(PF_ATTRIBUTE_TRANSLATIONS[lang])){
      if(normalizePfText(translated) === normalized) return english;
    }
  }
  return normalized;
}

function translatePfTextNode(node,lang){
  if(!node || node.nodeType !== Node.TEXT_NODE) return;
  const parent = node.parentElement;
  if(!parent || parent.closest("script,style,noscript")) return;
  const current = normalizePfText(node.nodeValue);
  if(!current) return;
  const english = pfEnglishKey(current);
  const translated = lang === "en" ? english : (PF_TRANSLATIONS[lang]?.[english] || english);
  if(translated !== current){
    const leading = (node.nodeValue.match(/^\s*/) || [""])[0];
    const trailing = (node.nodeValue.match(/\s*$/) || [""])[0];
    node.nodeValue = leading + translated + trailing;
  }
}

function translatePfAttributes(root,lang){
  const elements = [];
  if(root?.nodeType === Node.ELEMENT_NODE) elements.push(root);
  if(root?.querySelectorAll) elements.push(...root.querySelectorAll("[placeholder],[aria-label],[title]"));
  elements.forEach(el => {
    ["placeholder","aria-label","title"].forEach(attr => {
      if(!el.hasAttribute?.(attr)) return;
      const current = el.getAttribute(attr);
      const english = pfAttributeEnglishKey(current);
      const translated = lang === "en" ? english : (PF_ATTRIBUTE_TRANSLATIONS[lang]?.[english] || english);
      if(translated && translated !== current) el.setAttribute(attr,translated);
    });
  });
}

function translatePfSubtree(root,lang){
  if(!root) return;
  if(root.nodeType === Node.TEXT_NODE){
    translatePfTextNode(root,lang);
    return;
  }
  if(root.nodeType !== Node.ELEMENT_NODE && root.nodeType !== Node.DOCUMENT_NODE) return;
  const walker = document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
  let node;
  while((node = walker.nextNode())) translatePfTextNode(node,lang);
  translatePfAttributes(root,lang);
}

function applyLanguage(lang){
  const finalLang = ["en","es","pt"].includes(lang) ? lang : "en";
  document.documentElement.lang = finalLang;
  document.documentElement.dataset.language = finalLang;
  translatePfSubtree(document.body,finalLang);
  if(langSelect && langSelect.value !== finalLang) langSelect.value = finalLang;
  try{ localStorage.setItem("pf_lang",finalLang); }catch(error){}
}

function initialLanguage(){
  try{
    const saved = localStorage.getItem("pf_lang");
    if(["en","es","pt"].includes(saved)) return saved;
  }catch(error){}
  const browserLang = (navigator.language || "en").slice(0,2);
  return ["en","es","pt"].includes(browserLang) ? browserLang : "en";
}

let pfTranslationBusy = false;
const pfTranslationObserver = new MutationObserver(mutations => {
  if(pfTranslationBusy) return;
  const lang = document.documentElement.dataset.language || "en";
  if(lang === "en") return;
  pfTranslationBusy = true;
  try{
    mutations.forEach(mutation => {
      if(mutation.type === "characterData") translatePfTextNode(mutation.target,lang);
      mutation.addedNodes?.forEach(node => translatePfSubtree(node,lang));
    });
  }finally{
    pfTranslationBusy = false;
  }
});

pfTranslationObserver.observe(document.body,{
  childList:true,
  subtree:true,
  characterData:true
});

if(langSelect){
  const firstLang = initialLanguage();
  langSelect.value = firstLang;
  applyLanguage(firstLang);
  langSelect.addEventListener("change",event => applyLanguage(event.target.value));
}

'''

          text = text[:start] + new_block + text[end:]
          path.write_text(text, encoding='utf-8')
      - name: Remove one-time workflow and commit
        run: |
          git rm .github/workflows/fix-language-selector.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Make EN ES PT selector translate public website"
          git push
